services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Definir MYSQL_DATABASE en .env}"
      MYSQL_USER: "${MYSQL_USER:?Definir MYSQL_USER en .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD en .env}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: